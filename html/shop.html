<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop</title>
  <a href="homepage.html">Home</a>

  <link rel="stylesheet" href="../css/shop.css">
</head>
<body>
 
  
<main class ="container" role="main"></main>
<section class="layout" aria-label="Shopping area">
  <section class="catalog" aria-labelledby="catalog-title">
        <header style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <h2 id="catalog-title">Product Catalog</h2>
          <div style="color:#cfc6b8;font-size:.9rem">Select & add to cart</div>
        </header>
        <div class="controls">
          <label for="category">Category:</label>
          <select id="category" aria-controls="products">
            <option value="all">All</option>
            <option value="women">Women</option>
            <option value="men">Men</option>
            <option value="unisex">Unisex</option>
          </select>
           <label for="search" style="margin-left:6px">Search :</label>
          <input id="search" type="search" placeholder="Search a perfume..." aria-label="Search">

          <button id="clearFilters" style="margin-left:auto;padding:8px;border-radius:8px;background:#222;color:#fff;border:1px solid #333">Clear</button>
        </div>

        <div id="products" class="products-grid" aria-live="polite">
          
        </div>
      </section>

      <aside class="cart" aria-labelledby="cart-title">
        <h3 id="cart-title">Shopping Cart</h3>

        <div class="cart-list" id="cartList">
          <i style="color:#cfc6b8">Your cart is empty — add a product.</i>
        </div>

        <div class="totals" id="totalsArea" hidden>
          <div class="row"><span>Subtotal</span><span id="subtotal">€0.00</span></div>
          <div class="row"><span>Shipping</span><span id="shipping">€5.00</span></div>
          <div class="row" style="font-weight:700"><span>Total</span><span id="grandTotal">$0.00</span></div>
        </div>

        <form id="checkoutForm" class="checkout-form" novalidate>
          <label for="cname">Name</label>
          <input id="cname" name="name" required minlength="2" placeholder="Name and surname">

          <label for="cemail">Email</label>
          <input id="cemail" name="email" type="email" required placeholder="email@ty.com">

          <label for="address">Address</label>
          <textarea id="address" name="address" rows="2" required placeholder="Delivery address"></textarea>

          <label for="pay">Payment Method</label>
          <select id="pay" name="payment" required>
            <option value="">Choose...</option>
            <option value="card">Card (simulated)</option>
            <option value="cod">Cash on delivery</option>
          </select>

            <div style="display:flex;gap:8px;align-items:center;">
            <input id="agree" type="checkbox" required>
            <label for="agree" style="margin:0">I agree to the terms and conditions</label>
          </div>

          <button id="payBtn" class="pay-btn" type="submit" disabled>Pay & Order</button>
          <p id="formMsg" style="font-size:.9rem;color:#cfc6b8;margin-top:8px"></p>
        </form>
      </aside>
    </section>

    <div id="successModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);align-items:center;justify-content:center;">
      <div style="background:#0b0b0b;padding:20px;border-radius:12px;border:1px solid #222;max-width:420px;text-align:center;color:#fff">
        <h3 style="color:#d4af37">Order placed successfully!</h3>
        <p id="orderSummary" style="color:#cfc6b8"></p>
        <button id="closeModal" style="margin-top:12px;padding:8px 14px;border-radius:8px;background:#d4af37;border:none;cursor:pointer">Close</button>
      </div>
    </div>
    <div class="products"></div>
  </main>

    <script src="../javascript/shop.js"></script>
</body>
</html>
